name: NEXUS 0507 - 3D Contribution Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

# Prevent overlapping runs from trying to push to main simultaneously.
concurrency:
  group: profile-3d-contribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: priyadarshan0507

      - name: Commit and push generated graphics
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the files produced by this generator.
          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No generated graphics changed; nothing to commit."
            exit 0
          fi

          git commit -m "Update 3D contribution graphics"

          # Integrate any commits that reached origin/main during this run.
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
